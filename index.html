<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="super_big">
        <div class="top_panel">
            <div class="tp_left">
                <img src="icons/instagram.png" alt="" class="instagram">
                <h1>Instagram</h1>
            </div>
            <div class="tp_mid">
                <div class="icons">
                    <div class=""> <img src="icons/house.svg" alt=""></div>
                    <div class=""> <img src="icons/search.svg" alt=""></div>
                    <div class=""> <img src="icons/tv.svg" alt=""></div>
                    <div class=""> <img src="icons/heart.svg" alt=""></div>
                </div>
            </div>
            <div class="tp_right">
                <img src="icons/send-horizontal.svg" alt="">
                <div><img src="img/imagesa.jpeg" alt="" class="pfpp"></div>
            </div>
        </div>
        <div class="mid_cont">
            <div class="left_info">
                <div class="prof_info">
                    <div class="chav">
                        <img src="icons/chevron-left.svg" alt"" class="chevron">
                    </div>
                    <div class="idk"><img src="img/imagess.jpeg" alt="" class="pfppicture"></div>
                </div>
                <div class="info_prof">
                    <div class="posts">
                        <h4>518</h4>
                        <h5>Posts</h5>
                    </div>
                    <div class="followers">
                        <h4>220K</h4>
                        <h5>followers</h5>
                    </div>
                    <div class="following">
                        <h4>197</h4>
                        <h5>following</h5>
                    </div>
                </div>
                <div class="btns">
                    <button class="btn">Follow</button>
                </div>
                <div class="description">
                    <div class="first">
                        <h2>Jack Harding</h2>
                    </div>
                    <div class="space"></div>
                    <div class="second">
                        <h7>Travel, Adventure & Lifestyle
                            Photographer
                            Sony Imaging Ambassador
                            Currently in Edinburgh
                            Let's Work:
                            hello@jackharding.photo
                        </h7>
                        <a href="jackharding.photo/brandwork" class="link">
                    </div>
                    <div class="highlights">

                        <div class="h1">
                            <div class="highlight">
                                <img src="img/imagesssss.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Woolmart</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/imagessssss.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Wallpapers</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/imagesssssss.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Sweden</h6>
                                </div>
                            </div>
                        </div>
                        <div class="h2">
                            <div class="highlight">
                                <img src="img/561847802cdaee428af6c2ada7181a97asdasd.jpg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Croatia</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/images.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Madeira</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/imagesa.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Mackmyra</h6>
                                </div>
                            </div>
                        </div>
                        <div class="h3">
                            <div class="highlight">
                                <img src="img/imagesaa.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Indonesia</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/imagess.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">People</h6>
                                </div>
                            </div>
                            <div class="highlight">
                                <img src="img/imagesss.jpeg" alt="" class="highlight_pic">
                                <div>
                                    <h6 class="highlight_name">Watch all</h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="all">
                <div class="midpicandnav">
                    <div class="mid_pics">
                        <div class="picsers">
                            <div class="pic"><img src="img/images.jpeg" alt="" class="dapic"></div>
                            <div class="pic"><img src="img/561847802cdaee428af6c2ada7181a97asdasd.jpg" alt=""
                                    class="dapic"></div>
                            <div class="pic"><img src="img/imagesa.jpeg" alt="" class="dapic"></div>
                        </div>
                        <div class="picsers">
                            <div class="pic"><img src="img/imagesaa.jpeg" alt="" class="dapic"></div>
                            <div class="pic"><img src="img/imagess.jpeg" alt="" class="dapic"></div>
                            <div class="pic"><img src="img/imagesss.jpeg" alt="" class="dapic"></div>
                        </div>
                        <div class="picsers">
                            <div class="pic"><img src="img/imagesssss.jpeg" alt="" class="dapic"></div>
                            <div class="pic"><img src="img/imagessssss.jpeg" alt="" class="dapic"></div>
                            <div class="pic"><img src="img/imagesssssss.jpeg" alt="" class="dapic"></div>
                        </div>
                    </div>
                </div>

                <div class="right_navi">
                    <div class="top_icons">
                        <div class="mid_icon">
                            <img src="icons/grid-3x3.svg" alt="" style="height: 30px;" class="iccon">
                            <img src="icons/grid-2x2.svg" alt="" style="height: 30px;" class="iccon">
                            <img src="icons/square-dimensions.svg" alt="" style="height: 30px;" class="iccon">
                            <img src="icons/profile.svg" alt="" style="height: 30px;" class="iccon">
                        </div>
                        <div class="plus">
                            <img src="icons/square-plus.svg" alt="" class="pluss" style="height: 40px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
